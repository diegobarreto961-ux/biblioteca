spring.application.name=biblioteca

spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=postgres
# Senha e outros ajustes pessoais ficam em local.properties (não vai para o Git)
spring.config.import=optional:file:./local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:desenvolvimento-troque-esta-chave-por-uma-segura-123456}
app.jwt.expiracao-minutos=120

app.admin.nome=Administrador
app.admin.email=${ADMIN_EMAIL:admin@biblioteca.com}
app.admin.senha=${ADMIN_SENHA:admin12345}